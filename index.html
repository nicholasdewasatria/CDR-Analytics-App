*{box-sizing:border-box}body{margin:0;background:#f5f7fa;color:#17202b;font-family:Inter,Arial,sans-serif}
header{height:64px;background:#fff;border-bottom:1px solid #e5e9ef;display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:10}
.logo{font-weight:800;font-size:16px}.logo span{color:#667085;font-weight:500;font-size:11px;margin-left:8px}
button,select,input{font:inherit}.btn{border:0;border-radius:8px;padding:9px 13px;cursor:pointer;font-size:12px;font-weight:700}.dark{background:#17202b;color:white}.light{background:#eef1f5;color:#344054}
main{max-width:1400px;margin:auto;padding:25px 28px 50px}.upload{max-width:850px;margin:70px auto;text-align:center}.upload h1{font-size:42px;letter-spacing:-1.5px;margin:15px 0 8px}.upload p{color:#667085;line-height:1.6}.drop{margin-top:28px;background:white;border:1.5px dashed #b9c1cc;border-radius:16px;min-height:250px;display:flex;align-items:center;justify-content:center;flex-direction:column;cursor:pointer}.drop:hover{border-color:#17202b}.drop b{margin-top:12px}.drop small{color:#98a2b3;margin-top:6px}.error{background:#fff0ee;color:#b42318;padding:12px;border-radius:8px;margin-top:12px;font-size:12px}
.head{display:flex;justify-content:space-between;gap:15px;align-items:end;margin-bottom:18px}.head h1{margin:5px 0;font-size:28px}.muted{color:#667085;font-size:12px}.filters{display:flex;gap:8px;align-items:center}.filters select,.mapping select,.mapping input{border:1px solid #d7dde6;border-radius:7px;background:#fff;padding:8px;font-size:11px}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.card{background:white;border:1px solid #e6eaf0;border-radius:11px;padding:14px}.label{font-size:10px;color:#667085}.value{font-size:21px;font-weight:800;margin-top:5px}.sub{font-size:10px;color:#667085;margin-top:3px}
.section{background:#fff;border:1px solid #e6eaf0;border-radius:11px;margin-top:12px;overflow:hidden}.section-title{padding:13px 15px;border-bottom:1px solid #edf0f4;font-size:13px;font-weight:800;display:flex;justify-content:space-between;align-items:center}.section-body{padding:14px}
.mapping{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}.mapping label{font-size:10px;color:#667085;font-weight:700;display:flex;flex-direction:column;gap:5px}
.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse;min-width:650px}.table th{font-size:9px;color:#667085;background:#f8f9fb;text-align:left;text-transform:uppercase;padding:9px 11px}.table td{font-size:11px;padding:10px 11px;border-top:1px solid #eef0f3;white-space:nowrap}.table tr:hover td{background:#fafbfc}
.grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:12px}.grid2a{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chartbox{height:270px}.finding{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.finding div{padding:11px;border-radius:8px;background:#f7f8fa;font-size:11px;line-height:1.45}.finding b{display:block;margin-bottom:3px}.good{border-left:3px solid #16834b}.bad{border-left:3px solid #d92d20}.warn{border-left:3px solid #b54708}
.empty{text-align:center;color:#98a2b3;padding:25px;font-size:12px}.progress{display:none;margin-top:10px;color:#667085;font-size:12px}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:20px;color:#98a2b3;font-size:10px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}.mapping{grid-template-columns:repeat(2,1fr)}.grid2,.grid2a{grid-template-columns:1fr}.finding{grid-template-columns:1fr}}
@media(max-width:600px){header{padding:0 15px}.logo span{display:none}main{padding:18px 13px}.head{flex-direction:column;align-items:stretch}.filters{flex-wrap:wrap}.cards{grid-template-columns:1fr 1fr}.mapping{grid-template-columns:1fr}.upload{margin:45px auto}.upload h1{font-size:33px}footer{flex-direction:column;align-items:flex-start;gap:10px}}

body.dark-mode{background:#0d1117;color:#e6edf3}
body.dark-mode header{background:#111820;border-color:#222b36}
body.dark-mode .section,body.dark-mode .card,body.dark-mode .drop{background:#151c24;border-color:#27313d;color:#e6edf3}
body.dark-mode .muted,body.dark-mode .label,body.dark-mode .sub{color:#8b98a8}
body.dark-mode .table th{background:#111820;color:#8b98a8}
body.dark-mode .table td{border-color:#242d38}
body.dark-mode .table tr:hover td{background:#19212b}
body.dark-mode .mapping select,body.dark-mode .mapping input,body.dark-mode .filters select{background:#111820;border-color:#303b48;color:#e6edf3}
body.dark-mode .finding div{background:#111820}
body.dark-mode .light{background:#202936;color:#e6edf3}
.icon-btn{width:36px;height:36px;border:1px solid #d7dde6;background:#fff;color:#344054;border-radius:9px;display:inline-grid;place-items:center;cursor:pointer;transition:.18s ease}
.icon-btn:hover,.btn:hover,.ok-btn:hover{transform:translateY(-2px)}
body.dark-mode .icon-btn{background:#151c24;border-color:#303b48;color:#e6edf3}
.ok-btn{background:#17202b;color:#fff;border:0;border-radius:7px;padding:7px 11px;font-size:11px;font-weight:800;cursor:pointer;transition:.18s ease}
.section,.card,.finding div{animation:fadeUp .35s ease both}
@keyframes fadeUp{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
.toast{position:fixed;right:20px;bottom:20px;z-index:100;background:#17202b;color:#fff;border-radius:9px;padding:11px 14px;font-size:11px;box-shadow:0 10px 30px rgba(0,0,0,.2);animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

body{transition:background-color .25s ease,color .25s ease}
header,.section,.card,.drop{transition:background-color .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease}
.section{box-shadow:0 2px 8px rgba(16,24,40,.025)}
.card{box-shadow:0 2px 8px rgba(16,24,40,.025)}
.card:hover{transform:translateY(-2px);box-shadow:0 8px 22px rgba(16,24,40,.07)}
.filters select,.mapping select,.mapping input{transition:border-color .18s,box-shadow .18s}
.filters select:focus,.mapping select:focus,.mapping input:focus{outline:none;border-color:#7b8797;box-shadow:0 0 0 3px rgba(98,112,132,.12)}
.trivia-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trivia-card{background:#f7f8fa;border:1px solid #e5e9ef;border-radius:10px;padding:13px;transition:.18s ease}
.trivia-card:hover{transform:translateY(-2px)}
.trivia-code{font-size:15px;font-weight:800}.trivia-title{font-size:11px;font-weight:800;margin-top:4px}
.trivia-text{font-size:10px;color:#667085;line-height:1.5;margin-top:5px}
.trivia-note{font-size:10px;color:#667085;margin-top:11px;line-height:1.5}
body.dark-mode .trivia-card{background:#111820;border-color:#27313d}
body.dark-mode .trivia-text,body.dark-mode .trivia-note{color:#8b98a8}
body.dark-mode .section,body.dark-mode .card,body.dark-mode .drop{box-shadow:0 4px 18px rgba(0,0,0,.18)}
body.dark-mode .card:hover{box-shadow:0 10px 28px rgba(0,0,0,.28)}
@media(max-width:900px){.trivia-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.trivia-grid{grid-template-columns:1fr}}

/* High-contrast stats */
.stat-grid{gap:12px}
.stat-card{position:relative;overflow:hidden}
body.dark-mode .stat-card{
  background:#121a23!important;
  border-color:#334354!important;
  box-shadow:0 0 0 1px rgba(255,255,255,.025),0 8px 24px rgba(0,0,0,.24)
}
body.dark-mode .stat-card:nth-child(1) .stat-value{color:#66e3a3!important;text-shadow:0 0 18px rgba(102,227,163,.18)}
body.dark-mode .stat-card:nth-child(2) .stat-value{color:#5ee7a0!important;text-shadow:0 0 18px rgba(94,231,160,.18)}
body.dark-mode .stat-card:nth-child(3) .stat-value{color:#ff7b72!important;text-shadow:0 0 18px rgba(255,123,114,.18)}
body.dark-mode .stat-card:nth-child(4) .stat-value{color:#65b9ff!important;text-shadow:0 0 18px rgba(101,185,255,.18)}
body.dark-mode .stat-card:nth-child(5) .stat-value{color:#f2cc60!important;text-shadow:0 0 18px rgba(242,204,96,.18)}
body.dark-mode .stat-card .stat-label{color:#9eacbc!important}
body.dark-mode .stat-card .stat-sub{color:#7f8da0!important}
.stat-pct{font-size:11px;font-weight:800;margin-top:5px;letter-spacing:.01em}
.stat-pct.good{color:#16834b}.stat-pct.bad{color:#d92d20}.stat-pct.neutral{color:#667085}
body.dark-mode .stat-pct.good{color:#66e3a3}.body.dark-mode .stat-pct.bad{color:#ff7b72}
body.dark-mode .stat-pct.bad{color:#ff7b72}
body.dark-mode .stat-pct.neutral{color:#8fb8dc}

.failure-pct{font-weight:800;letter-spacing:.01em}
body.dark-mode .failure-pct{color:#65e7a0}

.connecting-highlight{border-left:3px solid #65e3a3}
body.dark-mode .connecting-highlight{background:#101a18!important}

.connecting-help{font-size:10px;color:#667085;line-height:1.5;margin-top:8px}
body.dark-mode .connecting-help{color:#8b98a8}

.provider-source-note{font-size:10px;color:#667085;line-height:1.45}
body.dark-mode .provider-source-note{color:#8b98a8}

.source-switch .btn{min-width:170px}
.upload-slot{min-height:210px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.upload-slot.drag{border-color:#17202b;transform:scale(1.01)}
body.dark-mode .upload-slot.drag{border-color:#65e7a0}
@media(max-width:650px){.source-switch{flex-direction:column}.source-switch .btn{width:100%}.uploadArea{grid-template-columns:1fr!important}}

/* =========================================================
   ARCANE UI THEME — visual-only enhancement
   ========================================================= */
:root{
  --arcane-1:#7c5cff;
  --arcane-2:#38bdf8;
  --arcane-3:#c084fc;
  --arcane-bg:#f6f7fb;
  --arcane-ink:#171528;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(circle at 10% -5%,rgba(124,92,255,.10),transparent 28%),
    radial-gradient(circle at 92% 8%,rgba(56,189,248,.08),transparent 25%),
    #f6f7fb;
  color:var(--arcane-ink);
  transition:background .35s ease,color .35s ease;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.22;
  background-image:
    radial-gradient(circle at 20% 30%,rgba(124,92,255,.18) 0 1px,transparent 1.5px),
    radial-gradient(circle at 80% 70%,rgba(56,189,248,.15) 0 1px,transparent 1.5px);
  background-size:90px 90px,130px 130px;
  animation:arcaneDrift 18s linear infinite;
}
@keyframes arcaneDrift{to{background-position:90px 90px,-130px -130px}}

header{
  background:linear-gradient(105deg,#ffffff 0%,#faf9ff 48%,#f5fbff 100%);
  border-bottom:1px solid rgba(124,92,255,.14);
  box-shadow:0 4px 24px rgba(55,40,110,.06);
  backdrop-filter:blur(14px);
}
.logo{
  position:relative;letter-spacing:-.02em;
  background:linear-gradient(90deg,#6d4aff,#168ac4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.logo::after{
  content:"";
  position:absolute;width:5px;height:5px;border-radius:50%;
  right:-10px;top:2px;background:#c084fc;
  box-shadow:0 0 12px #c084fc;
  animation:twinkle 2.2s ease-in-out infinite;
}
.logo span{color:#7b8494}
@keyframes twinkle{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.3)}}

.head h1{
  letter-spacing:-.035em;
  background:linear-gradient(100deg,#171528 5%,#6d4aff 55%,#168ac4 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.head{animation:fadeSlide .55s cubic-bezier(.2,.8,.2,1) both}
.upload{animation:fadeSlide .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes fadeSlide{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

.cards{gap:12px}
.card{
  position:relative;overflow:hidden;
  border-color:rgba(124,92,255,.13);
  box-shadow:0 6px 22px rgba(44,34,91,.045);
  transition:transform .28s cubic-bezier(.2,.8,.2,1),box-shadow .28s,border-color .28s;
}
.card::before{
  content:"";position:absolute;left:0;right:0;top:0;height:3px;
  background:linear-gradient(90deg,var(--arcane-1),var(--arcane-3),var(--arcane-2));
  transform:scaleX(.2);transform-origin:left;
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.card::after{
  content:"";position:absolute;width:90px;height:90px;right:-45px;top:-45px;
  background:radial-gradient(circle,rgba(124,92,255,.10),transparent 68%);
  pointer-events:none;
}
.card:hover{
  transform:translateY(-4px);
  border-color:rgba(124,92,255,.28);
  box-shadow:0 14px 34px rgba(63,42,135,.11);
}
.card:hover::before{transform:scaleX(1)}
.card .value{letter-spacing:-.025em}

.section{
  border-color:rgba(124,92,255,.12);
  box-shadow:0 5px 22px rgba(44,34,91,.035);
  transition:transform .28s,box-shadow .28s,border-color .28s;
  animation:sectionIn .45s cubic-bezier(.2,.8,.2,1) both;
}
.section:hover{border-color:rgba(124,92,255,.19);box-shadow:0 10px 30px rgba(44,34,91,.06)}
@keyframes sectionIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.section-title{
  background:linear-gradient(90deg,rgba(124,92,255,.035),transparent 60%);
  letter-spacing:-.01em;
}
.section-title:first-letter{color:#7c5cff}

.finding{gap:10px}
.finding div{
  position:relative;overflow:hidden;
  transition:transform .22s ease,box-shadow .22s ease,background .22s ease;
}
.finding div:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(40,30,90,.07)}
.finding div::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
}
.finding .good{border-left:0;background:linear-gradient(100deg,rgba(22,131,75,.10),rgba(22,131,75,.025))}
.finding .bad{border-left:0;background:linear-gradient(100deg,rgba(217,45,32,.10),rgba(217,45,32,.025))}
.finding .warn{border-left:0;background:linear-gradient(100deg,rgba(181,71,8,.11),rgba(181,71,8,.025))}
.finding .good::before{background:#35c982;box-shadow:0 0 12px rgba(53,201,130,.55)}
.finding .bad::before{background:#ff5c68;box-shadow:0 0 12px rgba(255,92,104,.5)}
.finding .warn::before{background:#f4ad45;box-shadow:0 0 12px rgba(244,173,69,.5)}

.btn,.icon-btn,.ok-btn{
  transition:transform .2s ease,box-shadow .2s ease,filter .2s ease,background .2s ease;
}
.btn:hover,.icon-btn:hover,.ok-btn:hover{transform:translateY(-2px)}
.btn.dark{
  background:linear-gradient(135deg,#29204f,#6849c9);
  box-shadow:0 7px 18px rgba(83,57,173,.20);
}
.btn.dark:hover{box-shadow:0 10px 24px rgba(83,57,173,.30);filter:brightness(1.06)}
.btn.light:hover{box-shadow:0 7px 18px rgba(44,34,91,.08)}

.drop{
  position:relative;
  border-color:rgba(124,92,255,.28);
  background:linear-gradient(145deg,rgba(255,255,255,.95),rgba(248,247,255,.95));
  box-shadow:0 8px 30px rgba(77,55,150,.05);
  transition:transform .3s,box-shadow .3s,border-color .3s,background .3s;
}
.drop::before{
  content:"✦";position:absolute;top:18px;right:22px;color:#c084fc;font-size:18px;
  opacity:.55;animation:floatSpark 3s ease-in-out infinite;
}
.drop:hover{
  transform:translateY(-3px);
  border-color:#7c5cff;
  box-shadow:0 14px 34px rgba(94,70,180,.13);
}
@keyframes floatSpark{0%,100%{transform:translateY(0) rotate(0);opacity:.35}50%{transform:translateY(-6px) rotate(12deg);opacity:.9}}

.toast{
  border:1px solid rgba(192,132,252,.32)!important;
  background:linear-gradient(135deg,rgba(26,20,48,.97),rgba(27,37,62,.97))!important;
  box-shadow:0 12px 35px rgba(30,20,70,.35),0 0 22px rgba(124,92,255,.12)!important;
  backdrop-filter:blur(12px);
  animation:toastMagic .4s cubic-bezier(.2,.8,.2,1)!important;
}
@keyframes toastMagic{
  from{opacity:0;transform:translateY(16px) scale(.96);filter:blur(3px)}
  to{opacity:1;transform:none;filter:none}
}

.progress{
  padding:8px 11px;border-radius:8px;
  background:linear-gradient(90deg,rgba(124,92,255,.07),rgba(56,189,248,.06));
}
.progress::before{
  content:"✦ ";color:#8b5cf6;animation:twinkle 1.2s infinite;
}

.table tr{transition:background .18s,transform .18s}
.table tr:hover td{background:linear-gradient(90deg,rgba(124,92,255,.055),rgba(56,189,248,.025))}

.trivia-card{transition:transform .25s,box-shadow .25s,border-color .25s}
.trivia-card:hover{
  transform:translateY(-3px);
  border-color:rgba(124,92,255,.30);
  box-shadow:0 10px 24px rgba(73,50,150,.10);
}
.trivia-code{
  background:linear-gradient(90deg,#7c5cff,#168ac4);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}

/* Elegant arcane night mode */

    radial-gradient(circle at 8% -10%,rgba(124,92,255,.18),transparent 30%),

<script>
const ALIASES={
 callDuration:["call duration","duration","billsec","talk time","conversation duration","call_duration"],
 destination:["destination number","destination","dst","dst number","phone number","phone","number","callee","called number","called","destination_number"],
 duration:["connecting duration","connect duration","connecting seconds","connecting duration ms","connecting_duration"],
 provider:["provider","destination provider","carrier","operator","route provider","vendor","trunk provider"],
 plan:["dialing plan","dial plan","dialplan","routing plan","route","routing","dialing_plan"],
 status:["termination reason","termination","failure cause","failure reason","hangup cause","cause","call status","status","disposition","call result","result","failure"]
};
const PREFIX_PROVIDER={
"0811":"Telkomsel","0812":"Telkomsel","0813":"Telkomsel","0821":"Telkomsel","0822":"Telkomsel","0823":"Telkomsel","0851":"Telkomsel","0852":"Telkomsel","0853":"Telkomsel",
"0814":"Indosat","0815":"Indosat","0816":"Indosat","0855":"Indosat","0856":"Indosat","0857":"Indosat","0858":"Indosat","0895":"Indosat","0896":"Indosat","0897":"Indosat","0898":"Indosat","0899":"Indosat",
"0817":"XL","0818":"XL","0819":"XL","0859":"XL","0877":"XL","0878":"XL",
"0831":"AXIS","0832":"AXIS","0833":"AXIS","0838":"AXIS",
"0881":"Smartfren","0882":"Smartfren","0883":"Smartfren","0884":"Smartfren","0885":"Smartfren","0886":"Smartfren","0887":"Smartfren","0888":"Smartfren","0889":"Smartfren"
};
const FAIL=[
 ["Busy",["busy","user busy","486"]],
 ["No Answer",["no answer","noanswer","ring timeout","timeout","noanswering"]],
 ["Temporarily Unavailable",["temporarily unavailable","unavailable","480"]],
 ["Congestion",["congestion","503","network congestion"]],
 ["Rejected",["rejected","reject","declined","decline","403","603"]],
 ["Caller Hangup",["caller hangup","caller hungup","cancel","cancelled","canceled","caller disconnected","hangup by caller"]]
];
let state=window.state={raw:[],headers:[],map:{},file:"",prefix:4,clientPrefix:"",provider:"All",prefixFilter:"All",result:null,base:null,dark:true,connectMin:15,connectMax:25,connectDivisor:1000,providerSource:"Tariff Description",sourceMode:"VPS",successFile:"",failedFile:"",analystNotes:"",durationMin:1};
let charts=[];

const $=id=>document.getElementById(id);
const key=s=>String(s??"").trim().toLowerCase().replace(/[_-]+/g," ").replace(/\s+/g," ");
function findCol(headers,aliases){
  const n=headers.map(key);
  for(const a of aliases){const i=n.indexOf(key(a));if(i>=0)return headers[i]}
  for(let i=0;i<n.length;i++)if(aliases.some(a=>n[i].includes(key(a))||key(a).includes(n[i])))return headers[i];
  return "";
}
function autoMap(headers){let m={};for(const [k,a] of Object.entries(ALIASES))m[k]=findCol(headers,a);return m}
function autoMapForMode(headers){
  const m=autoMap(headers);
  if(state.sourceMode==="VPS"){
    // VPS default: Release reason is used for termination/failure analysis; no Connecting Duration.
    m.destination=findCol(headers,["called number","called","callee","destination number","destination","dst"]);
    m.callDuration=findCol(headers,["duration","call duration","billsec","talk time"]);
    
    m.plan=findCol(headers,["route","routing plan","dialing plan","dial plan","dialplan"]);
    m.status=findCol(headers,["Release reason","release reason","release_reason","release cause","termination reason","termination","failure cause","cause","status"]);
  }
  return m;
}
function duration(v,divisor=1000){
  if(v==null||v==="")return 0;
  if(typeof v==="number")return Math.max(0,v)/divisor;
  let s=String(v).trim();if(!s)return 0;
  // In some CDR exports, 17.810 means 17,810 milliseconds.
  if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");
  else if(/^\d{1,3}(,\d{3})+$/.test(s))s=s.replace(/,/g,"");
  if(/^\d+(\.\d+)?$/.test(s))return Number(s)/divisor;
  let p=s.split(":").map(Number);
  if(p.length===3&&p.every(Number.isFinite))return p[0]*3600+p[1]*60+p[2];
  if(p.length===2&&p.every(Number.isFinite))return p[0]*60+p[1];
  return parseFloat(s.replace(",","."))||0;
}
function answeredStatus(v){
  let s=key(v);
  return ["answered","answer","success","connected","completed","up"].some(x=>s===x||s.includes(x));
}
function failure(v){
  let raw=String(v??"").trim();
  return raw || "Unknown";
}
function normalizeCallee(v){
  let d=String(v??"").replace(/\D/g,"");
  if(!d)return "";
  // Client-specific leading prefix, e.g. 44 + 0878... -> 0878...
  if(state.clientPrefix && d.startsWith(state.clientPrefix)) d=d.slice(state.clientPrefix.length);
  // International Indonesia format, e.g. 62878... -> 0878...
  if(d.startsWith("62")) d="0"+d.slice(2);
  // Some files may contain +62 / 62 after client-prefix stripping.
  if(d.startsWith("0")) return d;
  // If the remaining number starts directly with an Indonesian mobile prefix
  // such as 878, restore the national leading zero.
  if(PREFIX_PROVIDER["0"+d.slice(0,3)]) return "0"+d;
  return d;
}
function prefix(v){
  let d=normalizeCallee(v);
  return d?d.slice(0,state.prefix):"Unknown";
}

function providerFromRow(row,dest){
  if(state.providerSource && state.providerSource!=="AUTO_PREFIX"){
    const v=String(row[state.providerSource]??"").trim();
    return v||"Unknown";
  }
  return providerFromCallee(dest);
}
function providerFromCallee(v){
  let d=normalizeCallee(v);
  return PREFIX_PROVIDER[d.slice(0,4)] || "Unknown";
}
function pct(a,b){return b?a/b*100:0}
function fp(v){return (v||0).toFixed(1)+"%"}
function fmtSec(s){
  let n=Math.round(s||0),h=Math.floor(n/3600),m=Math.floor(n%3600/60),x=n%60;
  return h?`${h}h ${m}m ${x}s`:`${m}m ${x}s`;
}
function group(rows,fn){
  const m=new Map();rows.forEach(r=>{let k=fn(r);if(!m.has(k))m.set(k,[]);m.get(k).push(r)});
  return [...m.entries()];
}
function stats(rows,fn){
  return group(rows,fn).map(([name,rs])=>{
    let a=rs.filter(r=>r.answered).length, f=rs.length-a;
    let causes=group(rs.filter(r=>!r.answered),r=>r.failure).sort((x,y)=>y[1].length-x[1].length);
    return {name,total:rs.length,answered:a,failed:f,answerRate:pct(a,rs.length),failureRate:pct(f,rs.length),share:0,topFailure:causes[0]?.[0]||"—",rows:rs};
  }).sort((a,b)=>b.total-a.total);
}
function parseDurationValue(v){
  if(v===null||v===undefined||v==="") return 0;
  if(typeof v==="number") return Number.isFinite(v)?v:0;
  const t=String(v).trim().replace(",",".");
  const direct=Number(t);
  if(Number.isFinite(direct) && t!=="") return direct;
  const m=t.match(/^(?:(\d+):)?(\d{1,2}):(\d{1,2}(?:\.\d+)?)$/);
  if(m) return (Number(m[1])||0)*3600+(Number(m[2])||0)*60+Number(m[3]);
  return 0;
}

function analyze(raw){
  let rows=raw.map((x,i)=>{
    let dest=state.map.destination?x[state.map.destination]:"";
    let stat=state.map.status?x[state.map.status]:"";
    let vosDurationKey=state.map.callDuration || Object.keys(x||{}).find(k=>key(k)==="call duration"||key(k)==="duration"||key(k)==="billsec");
    let callDuration=vosDurationKey?duration(x[vosDurationKey]):0;
    let connectingDuration=state.sourceMode==="VOS" && state.map.duration?duration(x[state.map.duration],state.connectDivisor):0;
    let pdd=0;
    let a=x.__sourceStatus==="SUCCESS" ? true : x.__sourceStatus==="FAILED" ? false : callDuration>0;
    return {i,dest:String(dest??"").trim(),duration:connectingDuration,pdd,callDuration,
      provider:providerFromRow(x,dest),
      plan:state.map.plan?String(x[state.map.plan]??"").trim()||"Unknown":"Unknown",
      status:String(stat??"").trim(),answered:a,failure:a?"Answered":failure(stat),prefix:prefix(dest),raw:x};
  });
  let answered=rows.filter(r=>r.answered).length,failed=rows.length-answered;
  let failures=group(rows.filter(r=>!r.answered),r=>r.failure).map(([name,rs])=>({name,count:rs.length,percent:pct(rs.length,failed)})).sort((a,b)=>b.count-a.count);
  let providers=stats(rows,r=>r.provider),prefixes=stats(rows,r=>r.prefix),plans=stats(rows,r=>r.plan);
  providers.forEach(p=>p.share=pct(p.total,rows.length));
  prefixes.forEach(p=>p.share=pct(p.total,rows.length));
  plans.forEach(p=>p.share=pct(p.total,rows.length));

  let ranked=providers.filter(x=>x.total>=Math.max(1,Math.ceil(rows.length*.01)));
  let best=[...ranked].sort((a,b)=>b.answerRate-a.answerRate||b.total-a.total)[0];
  let worst=[...ranked].sort((a,b)=>a.answerRate-b.answerRate||b.total-a.total)[0];
  let worstPrefix=[...prefixes].sort((a,b)=>a.answerRate-b.answerRate||b.total-a.total)[0];
  let dominant=failures[0], findings=[];
  if(best)findings.push(["good","Provider terbaik",`${best.name} memiliki answer rate ${fp(best.answerRate)} dari ${best.total.toLocaleString()} call.`]);
  if(worst)findings.push(["bad","Provider terburuk",`${worst.name} memiliki answer rate ${fp(worst.answerRate)} dan failure rate ${fp(worst.failureRate)}.`]);
  if(worstPrefix)findings.push(["bad","Prefix perlu diperiksa",`Prefix ${worstPrefix.name} memiliki failure rate ${fp(worstPrefix.failureRate)} dari ${worstPrefix.total.toLocaleString()} call.`]);
  if(dominant)findings.push(["warn","Failure dominan",`${dominant.name} menyumbang ${dominant.count.toLocaleString()} failed call (${fp(dominant.percent)} dari failed call).`]);
  if(worst&&worst.failureRate>=30)findings.push(["warn","Routing perlu diperiksa",`Route ${worst.name} memiliki failure rate ${fp(worst.failureRate)}.`]);
  let rankedPlans=plans.filter(x=>x.total>=Math.max(1,Math.ceil(rows.length*.01)));
  let bestPlan=[...rankedPlans].sort((a,b)=>b.answerRate-a.answerRate||b.total-a.total)[0];
  let worstPlan=[...rankedPlans].sort((a,b)=>a.answerRate-b.answerRate||b.total-a.total)[0];
  if(bestPlan)findings.push(["good","Dialing plan terbaik",`${bestPlan.name} memiliki answer rate ${fp(bestPlan.answerRate)} dari ${bestPlan.total.toLocaleString()} call.`]);
  if(worstPlan)findings.push(["bad","Dialing plan perlu diperiksa",`${worstPlan.name} memiliki answer rate ${fp(worstPlan.answerRate)} dan failure rate ${fp(worstPlan.failureRate)}.`]);
  return {rows,total:rows.length,answered,failed,answerRate:pct(answered,rows.length),failureRate:pct(failed,rows.length),
    avg:rows.length?rows.reduce((s,r)=>s+r.duration,0)/rows.length:0,
    avgCallDuration:(()=>{
    const min=Number(state.durationMin??1);
    const values=rows.map(r=>{
      if(state.sourceMode==="VPS"){
        if(r.raw?.__sourceStatus!=="SUCCESS") return null;
        return parseDurationValue(Object.entries(r.raw||{}).find(([k])=>String(k).trim().toLowerCase()==="duration")?.[1]);
      }
      const ent=Object.entries(r.raw||{}).find(([k])=>{
        const n=String(k).trim().toLowerCase().replace(/[_-]+/g," ").replace(/\s+/g," ");
        return n==="call duration"||n==="duration"||n==="billsec";
      });
      return parseDurationValue(ent?.[1]);
    }).filter(v=>Number.isFinite(v)&&v>=min);
    return values.length?values.reduce((a,v)=>a+v,0)/values.length:0;
  })(),
  avgCallDurationCount:(()=>{
    const min=Number(state.durationMin??1);
    return rows.map(r=>{
      if(state.sourceMode==="VPS"){
        if(r.raw?.__sourceStatus!=="SUCCESS") return null;
        return parseDurationValue(Object.entries(r.raw||{}).find(([k])=>String(k).trim().toLowerCase()==="duration")?.[1]);
      }
      const ent=Object.entries(r.raw||{}).find(([k])=>{
        const n=String(k).trim().toLowerCase().replace(/[_-]+/g," ").replace(/\s+/g," ");
        return n==="call duration"||n==="duration"||n==="billsec";
      });
      return parseDurationValue(ent?.[1]);
    }).filter(v=>Number.isFinite(v)&&v>=min).length;
  })(),
    providers,prefixes,plans,failures,findings};
}

const SIP_TRIVIA=[
["480","Temporarily Unavailable","Tujuan sementara tidak tersedia. Bisa karena endpoint tidak reachable, device offline, atau kondisi jaringan sementara."],
["486","Busy Here","Endpoint tujuan sedang sibuk dan menolak menerima call baru."],
["487","Request Terminated","Request dihentikan sebelum call selesai, misalnya karena request dibatalkan atau call flow diterminasi."],
["403","Forbidden","Server memahami request tetapi menolaknya karena policy, permission, atau authorization."],
["404","Not Found","User, extension, atau tujuan yang diminta tidak ditemukan pada server/domain tersebut."],
["408","Request Timeout","Request tidak mendapatkan response yang diperlukan dalam batas waktu yang ditentukan."],
["503","Service Unavailable","Server atau service sementara tidak tersedia atau tidak mampu melayani request."],
["603","Decline","Tujuan mengetahui adanya call tetapi secara eksplisit menolak call."],
["500","Server Internal Error","Terjadi error internal pada SIP server/proxy yang memproses request."]
];

function connectingAnalysis(rows){
  // This analysis is ONLY for raw CallerHangup termination reasons.
  const callerHangups=rows.filter(r=>key(r.failure).replace(/\s+/g,"")==="callerhangup");
  const min=state.connectMin, max=state.connectMax;
  const below=callerHangups.filter(r=>r.duration<min);
  const effective=callerHangups.filter(r=>r.duration>=min && r.duration<=max);
  const above=callerHangups.filter(r=>r.duration>max);
  const total=callerHangups.length;
  const avg=total?callerHangups.reduce((sum,r)=>sum+r.duration,0)/total:0;
  return {
    total,below,effective,above,avg,
    belowPct:pct(below.length,total),
    effectivePct:pct(effective.length,total),
    abovePct:pct(above.length,total),
    recommendation: total
      ? (effective.length/total>=.5
          ? `Sebagian besar CallerHangup berada pada connecting ${min}-${max} detik.`
          : `Banyak CallerHangup terjadi di luar window ${min}-${max} detik; ring timeout/route behavior perlu diperiksa.`)
      : "Tidak ada CallerHangup yang dapat dianalisis."
  };
}
function renderConnectingAnalysis(r){
  const c=connectingAnalysis(r.rows);
  return `<div class="section">

        <label style="font-size:10px;color:#667085;font-weight:700;display:flex;flex-direction:column;gap:5px">
          Duration Divisor
          <div style="display:flex;gap:6px">
            <input id="connectDivisor" type="number" min="1" step="1" value="${state.connectDivisor}" style="border:1px solid #d7dde6;border-radius:7px;padding:8px;font-size:11px;width:85px">
          </div>
        </label>
        <label style="font-size:10px;color:#667085;font-weight:700;display:flex;flex-direction:column;gap:5px">
          Effective Min (seconds)
          <div style="display:flex;gap:6px">
            <input id="connectMin" type="number" min="0" max="3600" value="${state.connectMin}" style="border:1px solid #d7dde6;border-radius:7px;padding:8px;font-size:11px;width:80px">
          </div>
        </label>
        <label style="font-size:10px;color:#667085;font-weight:700;display:flex;flex-direction:column;gap:5px">
          Effective Max (seconds)
          <div style="display:flex;gap:6px">
            <input id="connectMax" type="number" min="0" max="3600" value="${state.connectMax}" style="border:1px solid #d7dde6;border-radius:7px;padding:8px;font-size:11px;width:80px">
            <button class="ok-btn" id="connectOk">OK</button>
          </div>
        </label>
        <div class="muted" style="max-width:650px;line-height:1.5">
          Divisor <b>${state.connectDivisor}</b>: raw connecting dibagi divisor. Contoh <b>17810 / 1000 = 17.81s</b>. Format <b>17.810</b> juga dibaca sebagai <b>17,810 ms</b>. Effective window <b>${state.connectMin}-${state.connectMax}s</b>.
        </div>
      </div>
      <div class="cards" style="grid-template-columns:repeat(4,1fr)">
        <div class="card"><div class="label">Caller Hangup</div><div class="value">${c.total.toLocaleString()}</div><div class="sub">100% population</div></div>
        <div class="card"><div class="label">Below ${state.connectMin}s</div><div class="value">${c.below.length.toLocaleString()}</div><div class="stat-pct bad">${fp(c.belowPct)}</div></div>
        <div class="card"><div class="label">Effective ${state.connectMin}-${state.connectMax}s</div><div class="value">${c.effective.length.toLocaleString()}</div><div class="stat-pct good">${fp(c.effectivePct)}</div></div>
        <div class="card"><div class="label">Above ${state.connectMax}s</div><div class="value">${c.above.length.toLocaleString()}</div><div class="stat-pct neutral">${fp(c.abovePct)}</div></div>
      </div>
      <div class="finding" style="margin-top:12px">
        <div class="${c.belowPct>30?'warn':'good'}"><b>Connecting Insight</b>${c.recommendation}</div>
        <div><b>Average Connecting</b>${fmtSec(c.avg)} untuk seluruh CallerHangup.</div>
      </div>
    </div>
  </div>`;
}

async function parseCdrFile(file){
  if(!file)throw Error("File belum dipilih.");
  if(file.name.toLowerCase().endsWith(".csv")){
    return await new Promise((resolve,reject)=>Papa.parse(file,{delimiter:"",skipEmptyLines:true,header:true,skipEmptyLines:true,complete:r=>resolve(r.data),error:reject}));
  }
  let b=await file.arrayBuffer(),w=XLSX.read(b,{type:"array",cellDates:true});
  return XLSX.utils.sheet_to_json(w.Sheets[w.SheetNames[0]],{defval:""});
}
async function loadFile(file){
  if(!file)return;
  $("progress").style.display="block";$("progress").textContent="Membaca dan menganalisis CDR...";
  try{
    let data=await parseCdrFile(file);
    if(!data.length)throw Error("File tidak berisi data.");
    state.raw=data.map(x=>({...x,__sourceStatus:"AUTO"}));
    state.file=file.name;state.headers=[...new Set(data.flatMap(x=>Object.keys(x)))];state.map=autoMapForMode(state.headers);
    // VOS always defaults to Callee Prefix automatically.
    if(state.sourceMode==="VOS") state.providerSource="AUTO_PREFIX";
    else state.providerSource=state.providerSource||"Tariff Description";
    state.provider="All";state.prefixFilter="All";renderDashboard();
  }catch(e){$("err").innerHTML=`<div class="error">${e.message||"Gagal membaca file."}</div>`}
}
async function loadVpsFiles(){
  $("err").innerHTML="";
  if(!state.successObject||!state.failedObject){$("err").innerHTML='<div class="error">Pilih kedua file: Success CDR dan Failed CDR.</div>';return}
  $("progress").style.display="block";$("progress").textContent="Membaca Success + Failed CDR...";
  try{
    const [success,failed]=await Promise.all([parseCdrFile(state.successObject),parseCdrFile(state.failedObject)]);
    if(!success.length&&!failed.length)throw Error("Kedua file tidak berisi data.");
    const successRows=success.map(x=>({...x,__sourceStatus:"SUCCESS"}));
    const failedRows=failed.map(x=>({...x,__sourceStatus:"FAILED"}));
    state.raw=[...successRows,...failedRows];
    state.file=`VPS: ${state.successFile} + ${state.failedFile}`;
    state.headers=[...new Set(state.raw.flatMap(x=>Object.keys(x)))];
    state.map=autoMapForMode(state.headers);
    if(state.headers.some(h=>key(h)==="tariff description")) state.providerSource=state.headers.find(h=>key(h)==="tariff description");
    state.provider="All";state.prefixFilter="All";renderDashboard();
  }catch(e){$("err").innerHTML=`<div class="error">${e.message||"Gagal membaca file VPS."}</div>`}
}

function table(rows,cols){
  if(!rows.length)return'<div class="empty">No data</div>';
  return`<div class="table-wrap"><table class="table sortable-table"><thead><tr>${cols.map((c,i)=>`<th class="sortable-th" onclick="sortTable(this,${i})" title="Click to sort">${c[0]} <span class="sort-indicator">↕</span></th>`).join("")}</tr></thead><tbody>${rows.map(r=>`<tr>${cols.map(c=>`<td data-value="${escapeHtml(String(r[c[1]]??""))}">${c[2]?c[2](r):r[c[1]]??""}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
}
function sortTable(th,colIndex){
  const tableEl=th.closest("table"),tbody=tableEl.tBodies[0],rows=[...tbody.rows];
  const asc=th.dataset.order!=="asc";
  tableEl.querySelectorAll(".sortable-th").forEach(h=>{h.dataset.order="";h.querySelector(".sort-indicator").textContent="↕"});
  th.dataset.order=asc?"asc":"desc";th.querySelector(".sort-indicator").textContent=asc?"↑":"↓";
  rows.sort((a,b)=>{
    const av=a.cells[colIndex].dataset.value??a.cells[colIndex].textContent.trim();
    const bv=b.cells[colIndex].dataset.value??b.cells[colIndex].textContent.trim();
    const an=Number(av.replace(/,/g,"")),bn=Number(bv.replace(/,/g,""));
    let cmp=Number.isFinite(an)&&Number.isFinite(bn)?an-bn:av.localeCompare(bv,undefined,{numeric:true,sensitivity:"base"});
    return asc?cmp:-cmp;
  });
  rows.forEach(r=>tbody.appendChild(r));
}

function drawCharts(r){

  charts.push(new Chart($("providerChart"),{type:"bar",data:{labels:r.providers.slice(0,10).map(x=>x.name),datasets:[
    {label:"Answer Rate",data:r.providers.slice(0,10).map(x=>x.answerRate),backgroundColor:answer,borderRadius:5},
    {label:"Failure Rate",data:r.providers.slice(0,10).map(x=>x.failureRate),backgroundColor:fail,borderRadius:5}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:text,font:{size:10}}},tooltip:{backgroundColor:dark?"#0b1016":"#17202b",titleColor:"#fff",bodyColor:"#fff"}},
    scales:{x:{ticks:{color:text,font:{size:9}},grid:{color:grid}},y:{beginAtZero:true,max:100,ticks:{color:text,callback:v=>v+"%",font:{size:9}},grid:{color:grid}}}}}));
  const failureTotal=r.failures.reduce((sum,x)=>sum+x.count,0);
  charts.push(new Chart($("failureChart"),{
    type:"doughnut",
    data:{
      labels:r.failures.map(x=>`${x.name} (${fp(failureTotal?x.count/failureTotal*100:0)})`),
      datasets:[{
        data:r.failures.map(x=>x.count),
        backgroundColor:dark?["#ff7b72","#f2cc60","#79c0ff","#d2a8ff","#ffa657","#56d364","#8b949e","#a5d6ff"]:["#d92d20","#b54708","#1570ef","#7f56d9","#dc6803","#16834b","#667085","#98a2b3"],
        borderColor:chartBg,borderWidth:3
      }]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{
        legend:{
          position:"bottom",
          labels:{color:text,font:{size:9},padding:10}
        },
        tooltip:{
          backgroundColor:dark?"#0b1016":"#17202b",
          titleColor:"#fff",
          bodyColor:"#fff",
          callbacks:{
            label:function(ctx){
              const count=ctx.raw||0;
              const pct=failureTotal?count/failureTotal*100:0;
              return ` ${count.toLocaleString()} calls (${pct.toFixed(1)}%)`;
            }
          }
        }
      }
    }
  }));
}

  function ensure(h=20){

  }
  function title(t,sub=""){
    ensure(13);
    doc.setTextColor(...C.ink);doc.setFont("helvetica","bold");doc.setFontSize(12);
    doc.text(t,ML,y);

  function addTable(head,body,opts={}){
    const rows=body&&body.length?body:[["No data"]];

  function noteBox(text){
    if(!text)return;

    doc.setTextColor(...C.ink);doc.setFont("helvetica","normal");doc.setFontSize(8);

  header();
  doc.setTextColor(...C.ink);doc.setFont("helvetica","bold");doc.setFontSize(20);
  doc.text("VoIP CDR Analyzer Report",ML,y);y+=7;
  doc.setFont("helvetica","normal");doc.setFontSize(8);doc.setTextColor(...C.muted);
  doc.text(`Report date: ${new Date().toLocaleString("id-ID")}`,ML,y);y+=4.5;

  title("1. Overall Summary",`${r.total.toLocaleString()} records analyzed`);
  addTable(["Metric","Value"],[

    ["Answer Rate",fp(r.answerRate)],

  ],{colStyles:{0:{cellWidth:90},1:{cellWidth:45}}});

  title("2. Dialing Plan Performance","Routing performance");
  addTable(["Dialing Plan","Calls","Answer Rate","Failure Rate","Top Failure"],r.plans.map(x=>[x.name,x.total.toLocaleString(),fp(x.answerRate),fp(x.failureRate),x.topFailure]));

  title("3. Provider Tujuan Performance","Provider tujuan");
  addTable(["Provider","Calls","Answer Rate","Failure Rate","Top Failure"],r.providers.map(x=>[x.name,x.total.toLocaleString(),fp(x.answerRate),fp(x.failureRate),x.topFailure]));

  title("5. Failure Distribution","Raw Termination / Release Reason");
  addTable(["Termination Reason","Count","Percentage"],r.failures.map(x=>[x.name,x.count.toLocaleString(),fp(x.percent)]));

  title("6. Important Findings");
  if(r.findings.length){
    r.findings.forEach((x,i)=>{
      const color=x[0]==="good"?C.good:x[0]==="bad"?C.bad:C.warn;
      const lines=doc.splitTextToSize(`${i+1}. ${x[1]} — ${x[2]}`,W-ML-MR-12);

      doc.setTextColor(...C.ink);doc.setFont("helvetica","bold");doc.setFontSize(8);doc.text(`${i+1}. ${x[1]}`,ML+7,y+5);
      doc.setFont("helvetica","normal");doc.setTextColor(...C.muted);doc.text(doc.splitTextToSize(x[2],W-ML-MR-20),ML+7,y+9,{lineHeightFactor:1.3});
      y+=h+3;
    });
  }else{
    doc.setTextColor(...C.muted);doc.setFontSize(8);doc.text("No automatic findings available.",ML,y);y+=8;
  }

  title("7. Analyst Notes","Failure Cause Summary / Notepad");
  if(state.analystNotes && state.analystNotes.trim()){
    noteBox(state.analystNotes.trim());
  }else{
    noteBox("No analyst notes were entered.");
  }

  if(state.sourceMode==="VOS"){
    title("8. Connecting Analysis","CallerHangup only");
    const c=connectingAnalysis(r.rows);
    addTable(["Category","Calls","Percentage"],[
      [`Below ${state.connectMin}s`,c.below.length.toLocaleString(),fp(c.belowPct)],
      [`Effective ${state.connectMin}-${state.connectMax}s`,c.effective.length.toLocaleString(),fp(c.effectivePct)],
      [`Above ${state.connectMax}s`,c.above.length.toLocaleString(),fp(c.abovePct)],
      ["Average Connecting",fmtSec(c.avg),"-"]
    ]);
  }

  footer();
  doc.save(`voip-cdr-report-${new Date().toISOString().slice(0,10)}.pdf`);
}

<script>
(function(){
  const popup=document.getElementById('cdrProgressPopup');
  const fill=document.getElementById('cdrProgressFill');
  const secs=document.getElementById('cdrProgressSeconds');
  const ring=document.getElementById('cdrProgressRing');
  let running=false;

  function showProgress(){
    if(running) return;
    running=true;
    const duration=1800;
    const start=performance.now();
    popup.classList.add('active');
    popup.setAttribute('aria-hidden','false');

    function tick(now){
      const elapsed=Math.min(now-start,duration);
      const progress=elapsed/duration;
      const remaining=Math.max(0, Math.ceil((duration-elapsed)/1000));
      fill.style.width=(progress*100)+'%';
      secs.textContent=remaining;
      ring.style.background='conic-gradient(#a78bfa '+(progress*220)+'deg,#d97706 '+(progress*300)+'deg,rgba(255,255,255,.09) '+(progress*300)+'deg)';
      if(progress<1){
        requestAnimationFrame(tick);
      }else{
        secs.textContent='✓';
        setTimeout(()=>{
          popup.classList.remove('active');
          popup.setAttribute('aria-hidden','true');
          fill.style.width='0';
          running=false;
        },220);
      }
    }
    requestAnimationFrame(tick);
  }

  // Capture click before existing inline/event handlers. Match OK even if button contains icons/spaces.
  document.addEventListener('click', function(e){
    const btn=e.target.closest('button, input[type="button"], input[type="submit"], [role="button"]');
    if(!btn) return;
    const label=(btn.innerText || btn.value || btn.textContent || '').replace(/\s+/g,' ').trim().toLowerCase();
    if(label==='ok' || /^ok\b/.test(label)) showProgress();
  }, true);

  // Also expose function so existing HTML handlers can call it directly if needed.
  window.showCDRProgress=showProgress;
})();
</script>

<script>
(function(){
  function digits(v){return String(v??'').replace(/\D/g,'')}
  function esc(v){return typeof escapeHtml==='function'?escapeHtml(String(v)):String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}

  // Detect whether a number is already an Indonesian mobile number.
  function normalizeDirect(n){
    n=digits(n);
    if(n.startsWith('62')) n='0'+n.slice(2);
    if(n.startsWith('8')) n='0'+n;
    return n;
  }
  function isMobile(n){
    n=normalizeDirect(n);
    if(!n.startsWith('08')) return false;
    if(typeof PREFIX_PROVIDER==='undefined') return /^08\d{8,12}$/.test(n);
    for(let len=4;len>=4;len--) if(PREFIX_PROVIDER[n.slice(0,len)]) return true;
    return false;
  }

  // A client prefix is the leading part before the actual destination number.
  // Example: 44 + 0878... => 44; 770 + 0857... => 770.
  function detectClientPrefix(raw){
    const n=digits(raw);
    const candidates=[];
    for(let len=1;len<=4 && len<n.length;len++){
      const p=n.slice(0,len), rest=n.slice(len);
      if(isMobile(rest)) candidates.push(p);
    }
    // If no client prefix can be proven, classify as 0 / Direct.
    if(!candidates.length) return '0';
    // Prefer the longest valid leading prefix.
    return candidates.sort((a,b)=>b.length-a.length)[0];
  }

  function destinationAfterPrefix(raw,p){
    let n=digits(raw);
    if(p!=='0' && n.startsWith(p)) n=n.slice(p.length);
    return normalizeDirect(n);
  }

  function operatorFor(n){
    if(typeof PREFIX_PROVIDER==='undefined') return 'Unknown';
    n=normalizeDirect(n);
    return PREFIX_PROVIDER[n.slice(0,4)] || 'Unknown';
  }

  function answered(row){
    const col=state.map && state.map.callDuration;
    if(!col) return false;
    const v=row[col];
    const num=typeof parseNum==='function' ? parseNum(v) : Number(String(v??'').replace(',','.'));
    return Number.isFinite(num) && num>0;
  }

  function render(){
    const sel=document.getElementById('clientPrefixAnswerSelect');
    const sort=document.getElementById('clientPrefixAnswerSort');
    const summary=document.getElementById('clientPrefixAnswerSummary');
    const out=document.getElementById('clientPrefixAnswerTable');
    if(!sel||!sort||!summary||!out) return;
    if(!window.state || !Array.isArray(state.raw) || !state.raw.length) return;
    if(!state.map || !state.map.destination || !state.map.callDuration) return;

    const rows=state.raw.map(row=>{
      const raw=digits(row[state.map.destination]);
      const cp=detectClientPrefix(raw);
      const dest=destinationAfterPrefix(raw,cp);
      return {cp,operator:operatorFor(dest),answered:answered(row)};
    });

    const prefixes=[...new Set(rows.map(x=>x.cp))]
      .sort((a,b)=>a==='0'?-1:b==='0'?1:(Number(a)-Number(b)));

    const previous=sel.value;
    sel.innerHTML=prefixes.map(p=>`<option value="${esc(p)}">${esc(p==='0'?'0 / Direct (No Prefix)':p)}</option>`).join('');
    if(prefixes.includes(previous)) sel.value=previous;

    function draw(){
      const chosen=sel.value;
      const data=rows.filter(x=>x.cp===chosen);
      const groups={};
      data.forEach(x=>{
        const g=groups[x.operator]||(groups[x.operator]={name:x.operator,total:0,answered:0,failed:0});
        g.total++;
        if(x.answered) g.answered++; else g.failed++;
      });
      const list=Object.values(groups).map(x=>({...x,rate:x.total?x.answered/x.total*100:0}));
      const key=sort.value;
      list.sort((a,b)=>(b[key]||0)-(a[key]||0));

      const total=data.length, ans=data.filter(x=>x.answered).length;
      const rate=total?ans/total*100:0;

      summary.innerHTML=`
        <div class="prefix-operator-card"><div class="label">CLIENT PREFIX</div><div class="value">${esc(chosen==='0'?'0 / Direct':chosen)}</div></div>
        <div class="prefix-operator-card"><div class="label">TOTAL CALLS</div><div class="value">${total.toLocaleString()}</div></div>
        <div class="prefix-operator-card"><div class="label">ANSWER RATE</div><div class="value">${rate.toFixed(1)}%</div></div>`;

      if(!list.length){
        out.innerHTML='<div class="empty">No destination operator data.</div>';
        return;
      }
      out.innerHTML=`<div style="overflow:auto"><table class="prefix-operator-table">
        <thead><tr><th>Destination Operator</th><th>Total Calls</th><th>Answered</th><th>Failed</th><th>Answer Rate</th><th>Performance</th></tr></thead>
        <tbody>${list.map(x=>`<tr>
          <td><strong>${esc(x.name)}</strong></td>
          <td>${x.total.toLocaleString()}</td><td>${x.answered.toLocaleString()}</td><td>${x.failed.toLocaleString()}</td>
          <td><strong class="prefix-rate">${x.rate.toFixed(1)}%</strong></td>
          <td><div class="prefix-rate-bar"><span style="width:${Math.min(100,x.rate)}%"></span></div></td>
        </tr>`).join('')}</tbody></table></div>`;
    }

    if(sel.dataset.bound!=='1'){sel.addEventListener('change',draw);sel.dataset.bound='1'}
    if(sort.dataset.bound!=='1'){sort.addEventListener('change',draw);sort.dataset.bound='1'}
    draw();
  }

  window.renderPrefixOperator=render;

  let signature='';
  setInterval(()=>{
    if(!window.state) return;
    const sig=[state.raw?.length,state.map?.destination,state.map?.callDuration,state.file].join('|');
    if(sig!==signature){signature=sig;render();}
  },300);
})();
</script>

<script>
(function(){

      String(v).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

    if(!rows.length){
      sel.innerHTML='';
      summary.innerHTML='';
      out.innerHTML='<div class="empty">No analyzed CDR data.</div>';
      return;
    }

    // Every analyzed row already has the normalized dialing plan and destination provider.

      .sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}));

    const previous=sel.value;
    sel.innerHTML=plans.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('');

        });
        g.total++;
        if(r.answered) g.answered++;
        else g.failed++;
      });

      }));

      const key=sort.value;

          <div class="value">${total.toLocaleString()}</div>
        </div>
        <div class="prefix-operator-card">
          <div class="label">OVERALL ANSWER RATE</div>
          <div class="value">${rate.toFixed(1)}%</div>
        </div>`;

      if(!list.length){
        out.innerHTML='<div class="empty">No destination operator data for this dialing plan.</div>';
        return;
      }

      out.innerHTML=`
        <div style="overflow:auto">
          <table class="prefix-operator-table">
            <thead>
              <tr>
                <th>Destination Operator</th>
                <th>Total Calls</th>
                <th>Answered</th>
                <th>Failed</th>
                <th>Answer Rate</th>
                <th>Performance</th>
              </tr>
            </thead>
            <tbody>
              ${list.map(g=>`
                <tr>
                  <td><strong>${esc(g.name)}</strong></td>
                  <td>${g.total.toLocaleString()}</td>
                  <td>${g.answered.toLocaleString()}</td>
                  <td>${g.failed.toLocaleString()}</td>
                  <td><strong class="prefix-rate">${g.rate.toFixed(1)}%</strong></td>
                  <td>
                    <div class="prefix-rate-bar">
                      <span style="width:${Math.min(100,g.rate)}%"></span>
                    </div>
                  </td>
                </tr>`).join('')}
            </tbody>
          </table>
        </div>`;
    }

    if(sel.dataset.bound!=='1'){
      sel.addEventListener('change',draw);
      sel.dataset.bound='1';
    }
    if(sort.dataset.bound!=='1'){
      sort.addEventListener('change',draw);
      sort.dataset.bound='1';
    }
    draw();
  }

  window.renderDialingPlanGateway=renderDialingPlanGateway;

  let signature='';
  setInterval(()=>{
    if(!window.state) return;
    const rows=state.base?.rows||[];
    const sig=[rows.length,state.sourceMode,state.providerSource].join('|');
    if(sig!==signature){
      signature=sig;
      renderDialingPlanGateway();
    }
  },300);
})();
</script>

    if(document.body){
      document.body.classList.remove('light','light-mode');
      document.body.classList.add('dark','dark-mode');
      document.body.setAttribute('data-theme','dark');
    }
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',forceDark);
  else forceDark();
})();
</script>
</body>
</html>
